name: Deploy to GitHub Pages

# main を本番、preview を試遊版として同じサイトに載せる。
#   本番    https://hiro0224world.github.io/enbu/
#   試遊版  https://hiro0224world.github.io/enbu/preview/
#
# **公開できるのは main を起点にした実行だけ**（GitHub Pages の環境設定が
# 既定でそうなっている）。preview へ push されたときは、main を起点に
# もう一度この workflow を走らせ、そちらで両方を作って公開する。
on:
  push:
    branches: [main, preview]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # preview への push は、main を起点にした実行へ橋渡しするだけ
  redispatch:
    if: github.ref_name != 'main'
    runs-on: ubuntu-latest
    steps:
      - name: main を起点に作り直す
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main

  build:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      # ---- 本番（main） ----
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      # ---- 試遊版（preview）。ブランチが無ければ飛ばす ----
      - name: preview ブランチがあるか調べる
        id: has_preview
        run: |
          if git ls-remote --exit-code --heads origin preview >/dev/null 2>&1; then
            echo "found=yes" >> "$GITHUB_OUTPUT"
          else
            echo "found=no" >> "$GITHUB_OUTPUT"
            echo "preview ブランチが無いので試遊版は作らない"
          fi

      - uses: actions/checkout@v4
        if: steps.has_preview.outputs.found == 'yes'
        with:
          ref: preview
          path: _preview

      - name: 試遊版を作る
        if: steps.has_preview.outputs.found == 'yes'
        working-directory: _preview
        env:
          # 置き場所が 1 階層深くなるので、参照の起点を変える
          BASE_PATH: /enbu/preview/
        run: |
          npm ci
          npm run build
          mkdir -p ../dist/preview
          cp -r dist/* ../dist/preview/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
